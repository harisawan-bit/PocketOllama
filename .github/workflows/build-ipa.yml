name: Build & Release iOS IPA (PocketOllama)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Sideloadable iOS IPA
    runs-on: macos-15 # Apple Silicon Runner with Xcode 16
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (Unsigned for Sideloading)
        run: |
          xcodebuild build \
            -project PocketOllama.xcodeproj \
            -scheme PocketOllama \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            GCC_PREPROCESSOR_DEFINITIONS="GGML_USE_METAL=1 SWIFT_PACKAGE=1" \
            OTHER_SWIFT_FLAGS="-D GGML_USE_METAL"

      - name: Package App into Sideloadable .IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "PocketOllama.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: PocketOllama.app not found in DerivedData"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -9 PocketOllama.ipa Payload
          cd ..
          ls -lh build/PocketOllama.ipa

      - name: Upload IPA as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketOllama-iOS-IPA
          path: build/PocketOllama.ipa
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.0.${{ github.run_number }}"
          name: "PocketOllama iOS v2.0.${{ github.run_number }}"
          files: build/PocketOllama.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
