name: PocketOllama
options:
  bundleIdPrefix: com.haris
  deploymentTarget:
    iOS: "16.4"
  xcodeVersion: "15.0"
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.4"
  TARGETED_DEVICE_FAMILY: "1,2" # iPhone, iPad
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGNING_ALLOWED: NO

targets:
  PocketOllama:
    type: application
    platform: iOS
    sources:
      - path: PocketOllama
        excludes:
          - "Resources/Info.plist"
          - "Resources/PocketOllama.entitlements"
    info:
      path: PocketOllama/Resources/Info.plist
      properties:
        CFBundleDisplayName: "PocketOllama"
        CFBundleShortVersionString: "2.7.0"
        CFBundleVersion: "10"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "PocketOllama serves an OpenAI-compatible API on your local Wi-Fi network."
        NSBonjourServices: ["_ollama._tcp", "_openai._tcp"]
    entitlements:
      path: PocketOllama/Resources/PocketOllama.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.haris.pocketollama
      MARKETING_VERSION: "2.2.0"
      CURRENT_PROJECT_VERSION: "3"
      INFOPLIST_FILE: PocketOllama/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      OTHER_SWIFT_FLAGS: ""
      OTHER_LDFLAGS: "-lc++"
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: false
