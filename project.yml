name: PocketOllama
options:
  bundleIdPrefix: com.haris
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  ENABLE_BITCODE: NO
  TARGETED_DEVICE_FAMILY: "1,2" # iPhone, iPad
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGNING_ALLOWED: NO

targets:
  PocketOllama:
    type: application
    platform: iOS
    sources:
      - path: PocketOllama
        excludes:
          - "Resources/Info.plist"
          - "Resources/PocketOllama.entitlements"
    info:
      path: PocketOllama/Resources/Info.plist
      properties:
        CFBundleDisplayName: "PocketOllama"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "PocketOllama serves an OpenAI-compatible API on your local Wi-Fi network."
        UIBackgroundModes: ["audio", "processing"]
    entitlements:
      path: PocketOllama/Resources/PocketOllama.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.haris.pocketollama
      INFOPLIST_FILE: PocketOllama/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      OTHER_SWIFT_FLAGS: "-D GGML_USE_METAL -D SWIFT_PACKAGE"
